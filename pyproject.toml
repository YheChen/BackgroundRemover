[project]
name = "bgremover"
version = "0.0.1"
description = "Free, open-source background removal: a full six-stage cutout pipeline, MIT weights only."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Yanzhen Chen" }]
requires-python = ">=3.10"
keywords = ["background-removal", "alpha-matting", "segmentation", "cutout"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]

# Runtime deps stay light on purpose: the shipping path is ONNX, which is
# CPU-viable and is what the browser build needs anyway. torch is only for
# the reference implementation and for exporting ONNX (see [torch] extra).
dependencies = [
  "numpy>=1.24",
  "pillow>=10",
  "onnxruntime>=1.17",
  "pymatting>=1.1.12",
  "scipy>=1.10",
]

[project.optional-dependencies]
# Reference implementation + ONNX export. Heavy (~2.5 GB).
torch = [
  "torch>=2.2",
  "transformers>=4.40",
  "timm>=1.0",
  "huggingface-hub>=0.23",
  "einops>=0.7",
  "kornia>=0.7",
]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
bgremover = "bgremover.cli:main"

[project.urls]
Homepage = "https://github.com/yanzhenchen/BackgroundRemover"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bgremover"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
